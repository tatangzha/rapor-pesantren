{% extends 'base.html' %}
{% block title %}Error {{ code }}{% endblock %}
{% block body %}
<div class="min-h-screen grid place-items-center p-6 bg-brand-50">
  <div class="text-center fade-in">
    <p class="text-8xl font-extrabold text-brand-600">{{ code }}</p>
    <p class="mt-4 text-slate-600">{{ msg }}</p>

  </div>
</div>
{% endblock %}
